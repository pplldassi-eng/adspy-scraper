name: Scraper Meta Ads

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Mot-clé COD'
        required: false
        default: 'livraison gratuite'
      country:
        description: 'Pays (CI, SN, CM)'
        required: false
        default: 'CI'
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Installer Chromium Playwright
        run: npx playwright install chromium

      - name: Installer Flaregun
        run: npm install -g @miclivs/flaregun

      - name: Determiner mot-cle et pays selon l'heure
        id: config
        run: |
          HOUR=$(date -u +%H)
          case "$HOUR" in
            00) echo "keyword=livraison gratuite" >> $GITHUB_OUTPUT; echo "country=CI" >> $GITHUB_OUTPUT ;;
            01) echo "keyword=livraison gratuite" >> $GITHUB_OUTPUT; echo "country=SN" >> $GITHUB_OUTPUT ;;
            02) echo "keyword=livraison gratuite" >> $GITHUB_OUTPUT; echo "country=CM" >> $GITHUB_OUTPUT ;;
            03) echo "keyword=paiement à la livraison" >> $GITHUB_OUTPUT; echo "country=CI" >> $GITHUB_OUTPUT ;;
            04) echo "keyword=paiement à la livraison" >> $GITHUB_OUTPUT; echo "country=SN" >> $GITHUB_OUTPUT ;;
            05) echo "keyword=paiement à la livraison" >> $GITHUB_OUTPUT; echo "country=CM" >> $GITHUB_OUTPUT ;;
            06) echo "keyword=payez à la réception" >> $GITHUB_OUTPUT; echo "country=CI" >> $GITHUB_OUTPUT ;;
            07) echo "keyword=payez à la réception" >> $GITHUB_OUTPUT; echo "country=SN" >> $GITHUB_OUTPUT ;;
            08) echo "keyword=payez à la réception" >> $GITHUB_OUTPUT; echo "country=CM" >> $GITHUB_OUTPUT ;;
            09) echo "keyword=cash à la livraison" >> $GITHUB_OUTPUT; echo "country=CI" >> $GITHUB_OUTPUT ;;
            10) echo "keyword=cash à la livraison" >> $GITHUB_OUTPUT; echo "country=SN" >> $GITHUB_OUTPUT ;;
            11) echo "keyword=cash à la livraison" >> $GITHUB_OUTPUT; echo "country=CM" >> $GITHUB_OUTPUT ;;
            12) echo "keyword=livraison partout" >> $GITHUB_OUTPUT; echo "country=CI" >> $GITHUB_OUTPUT ;;
            13) echo "keyword=livraison partout" >> $GITHUB_OUTPUT; echo "country=SN" >> $GITHUB_OUTPUT ;;
            14) echo "keyword=livraison partout" >> $GITHUB_OUTPUT; echo "country=CM" >> $GITHUB_OUTPUT ;;
            15) echo "keyword=commander sur whatsapp" >> $GITHUB_OUTPUT; echo "country=CI" >> $GITHUB_OUTPUT ;;
            16) echo "keyword=commander sur whatsapp" >> $GITHUB_OUTPUT; echo "country=SN" >> $GITHUB_OUTPUT ;;
            17) echo "keyword=commander sur whatsapp" >> $GITHUB_OUTPUT; echo "country=CM" >> $GITHUB_OUTPUT ;;
            *) echo "keyword=${{ github.event.inputs.keyword || 'livraison gratuite' }}" >> $GITHUB_OUTPUT; echo "country=${{ github.event.inputs.country || 'CI' }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Lancer Flaregun et le scraper dans la MEME etape
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SCRAPE_KEYWORD: ${{ steps.config.outputs.keyword }}
          SCRAPE_COUNTRY: ${{ steps.config.outputs.country }}
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: |
          flaregun init --token "$CLOUDFLARE_API_TOKEN" --account "$CLOUDFLARE_ACCOUNT_ID"
          flaregun up 10
          flaregun serve --port 8080 &
          FLAREGUN_PID=$!
          sleep 10
          curl --max-time 15 --proxy http://localhost:8080 https://httpbin.org/ip || echo "Curl a echoue"
          npx tsx scraper/index.ts || echo "Scraper a echoue"
          kill $FLAREGUN_PID 2>/dev/null || true
          flaregun down || true

      - name: Uploader les fichiers de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-facebook
          path: debug/
          retention-days: 7
