name: Scraper Meta Ads

on:
  workflow_dispatch:        # bouton manuel dans GitHub
  schedule:
    - cron: '0 2 * * *'     # tous les jours à 2h UTC (2h du matin GMT)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Installer Playwright
        run: npx playwright install chromium --with-deps

      - name: Lancer le scraper
        run: npx tsx scraper/index.ts
